name: Release

# Publie l'image Docker versionnée d'une release sur GHCR.
# - push d'un tag vX.Y.Z : build + push X.Y.Z, X.Y, X et latest
# - workflow_dispatch : rattache une image déjà publiée par la CI de master
#   (tag master-<sha>) à une version existante, sans rebuild ni tag flottant.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier, sans le "v" (ex. 0.4.0)'
        required: true
        type: string
      source_tag:
        description: "Tag d'image GHCR existant à re-tagger (ex. master-<sha>)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      # GHCR impose un nom d'image en minuscules.
      - name: Compute image name
        id: img
        run: echo "name=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=true

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retag existing image
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          VERSION: ${{ inputs.version }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version invalide : $VERSION"; exit 1; }
          [[ "$SOURCE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Tag source invalide : $SOURCE_TAG"; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$SOURCE_TAG"

      - name: Summary
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$TAGS" ]; then
            echo "$TAGS" | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- \`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          fi
